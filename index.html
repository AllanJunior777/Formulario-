<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1 class="tituloPrincipal">
            primeiro formulario 
        </h1>
        
    </header>
     <main class="principal">

    <form action="" class="formulario">

      <h2 class="tituloFormulario">
          login
        </h2>
        <div class="caixaCampo">
            <label class="rotuloCampo" for="nomeCampo">
               nome
            </label>
            <input 
            type="text" 
            id="nomeCampo" 
            class="campoFormulario"
            placeholder="Digite seu nome..." 
            >
        </div>
        <div class="caixaCampo">
            <label class="rotuloCampo" for="emailCampo">
               email
            </label>
            <input 
            type="text" 
            id="emailCampo" 
            class="campoFormulario"
            placeholder="Digite seu email..." 
            >
        </div>
        <div class="caixaCampo">
            <label class="rotuloCampo" for="senhaCampo">
               senha
            </label>
            <input 
            type="text" 
            id="senhaCampo" 
            class="campoFormulario"
            placeholder="Digite sua senha..." 
            >
        </div>

           <botton class="btnEnviar">Enviar</botton>
           
        </form>

     </main>
</body>
</html>
